services:
  - type: web
    name: work-mirror
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: work-mirror-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/work_mirror.db
      - key: AI_ENABLED
        value: true
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
