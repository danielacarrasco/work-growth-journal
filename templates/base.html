<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Work Mirror{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="/">
        Work Mirror
        <span class="tagline">Private leadership log</span>
      </a>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-label">Overview</span>
        <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 6v9h5V9h4v6h5V6z"/></svg>
          Home
        </a>
        <a href="/advisor" class="nav-item {% if '/advisor' in request.url.path %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 2a5 5 0 1 1 0 10A5 5 0 0 1 8 3zm-.5 2.5v4l3 1.5-.5 1-3.5-2V5.5h1z"/></svg>
          Advisor
        </a>
      </div>
      <div class="nav-section">
        <span class="nav-label">Intelligence</span>
        <a href="/stakeholders" class="nav-item {% if '/stakeholders' in request.url.path %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm5 5a5 5 0 0 0-10 0h10z"/></svg>
          Stakeholders
        </a>
        <a href="/projects" class="nav-item {% if '/projects' in request.url.path %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v2H2zM2 6h12v2H2zm0 4h8v2H2zm10 0l2 2-2 2v-4z"/></svg>
          Projects
        </a>
        <a href="/patterns" class="nav-item {% if '/patterns' in request.url.path %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3h14v2H1zm2 4h10v2H3zm2 4h6v2H5z"/></svg>
          Patterns
        </a>
      </div>
      <div class="nav-section">
        <span class="nav-label">Log</span>
        <a href="/interactions" class="nav-item {% if '/interactions' in request.url.path %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v10H9l-4 3v-3H2V2zm2 3v1h8V5H4zm0 3v1h6V8H4z"/></svg>
          Interactions
        </a>
        <a href="/meeting-prep" class="nav-item {% if '/meeting-prep' in request.url.path %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm1 3v1h8V4H4zm0 3v1h8V7H4zm0 3v1h5v-1H4z"/></svg>
          Meeting Prep
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <a href="/settings">Settings</a>
      <a href="/settings/export" style="margin-top:4px;">Export data</a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
